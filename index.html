<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac DeMarco - Live Special Edition</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: rgba(30, 30, 30, 0.85);
      --accent: #e52b2b; /* Rosso */
      --text: #ffffff;
      --subtext: #aaaaaa;
      --vinyl-center: #2b5be5; /* Blu per il centro del vinile */
    }

    body {
      margin: 0;
      padding: 20px 15px;
      background-color: var(--bg-color);
      /* Immagine di sfondo locale con velatura scura */
      background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('MacDeMarco.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    /* Player / Turntable Style */
    .turntable {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .record-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
    }

    .record {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #333 18%, #111 18%, #111 24%, #222 25%, #111 60%, #000 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 3s linear infinite;
      animation-play-state: paused;
    }

    .record.playing {
      animation-play-state: running;
    }

    /* Etichetta centrale del vinile: Blu senza testo */
    .record-label {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--vinyl-center);
      border: 3px solid #000;
      position: relative;
    }

    /* Foro centrale del vinile */
    .record-label::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .track-info {
      margin-bottom: 15px;
    }

    .track-side {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 700;
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress & Time */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      font-size: 12px;
      color: var(--subtext);
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #444;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 10px;
      transition: transform 0.1s;
    }

    .btn:active { transform: scale(0.9); }

    .btn-main {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: var(--subtext);
    }

    .volume-slider {
      width: 100px;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #444;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text);
    }

    /* Tracklist */
    .tracklist {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .side-header {
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 1.5px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin: 15px 0 10px;
    }

    .side-header:first-child { margin-top: 0; }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .track-item:hover, .track-item.active {
      background: rgba(255, 255, 255, 0.1);
    }

    .track-item.active .t-name {
      color: var(--accent);
      font-weight: bold;
    }

    .download-btn {
      color: var(--subtext);
      text-decoration: none;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #555;
      border-radius: 4px;
      transition: border-color 0.2s, color 0.2s;
    }

    .download-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .zip-download {
      display: block;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      margin-top: 20px;
      font-weight: 500;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background 0.2s;
    }

    .zip-download:hover {
      background: rgba(229, 43, 43, 0.2);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="turntable">
    <div class="record-container">
      <div class="record" id="vinyl">
        <div class="record-label"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-side" id="display-side">SIDE A</div>
      <div class="track-title" id="display-title">Seleziona una traccia</div>
    </div>

    <div class="progress-container">
      <span id="current-time">0:00</span>
      <input type="range" id="progress" class="progress-bar" value="0" min="0" step="0.1">
      <span id="total-time">0:00</span>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevTrack()">⏮</button>
      <button class="btn btn-main" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="btn" onclick="stopTrack()">⏹</button>
      <button class="btn" onclick="nextTrack()">⏭</button>
    </div>

    <div class="volume-container">
      <span id="mute-btn" style="cursor:pointer;" onclick="toggleMute()">🔊</span>
      <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

  <div class="tracklist">
    <div class="side-header">SIDE A</div>
    <div id="side-a-tracks"></div>

    <div class="side-header">SIDE B</div>
    <div id="side-b-tracks"></div>

    <a href="https://drive.google.com/drive/folders/1keV0mdtPuHWr4lfId9uJqmzdjN7uXX_3?usp=sharing" target="_blank" class="zip-download">📦 Scarica Album Completo su Google Drive</a>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  // MODIFICA CHIAVE: Carichiamo l'audio dalla stessa cartella di GitHub senza passare per jsDelivr
  const baseUrl = "";

  const playlist = [
    // SIDE A
    { side: "SIDE A", track: "01", title: "Intro", file: "01.-.Intro.mp3" },
    { side: "SIDE A", track: "02", title: "Shining", file: "02.-.Shining.mp3" },
    { side: "SIDE A", track: "03", title: "For The First Time", file: "03.-.For.The.First.Time.mp3" },
    { side: "SIDE A", track: "04", title: "Sweeter", file: "04.-.Sweeter.mp3" },
    { side: "SIDE A", track: "05", title: "On The Level", file: "05.-.On.The.Level.mp3" },
    { side: "SIDE A", track: "06", title: "Phantom", file: "06.-.Phantom.mp3" },
    { side: "SIDE A", track: "07", title: "Salad Days", file: "07.-.Salad.Days.mp3" },
    { side: "SIDE A", track: "08", title: "I Like Her", file: "08.-.I.Like.Her.mp3" },
    { side: "SIDE A", track: "09", title: "Rock And Roll", file: "09.-.Rock.And.Roll.mp3" },
    { side: "SIDE A", track: "10", title: "Terror", file: "10.-.Terror.mp3" },
    { side: "SIDE A", track: "11", title: "Finally Alone", file: "11.-.Finally.Alone.mp3" },
    { side: "SIDE A", track: "12", title: "All Of Our Yesterdays", file: "12.-.All.Of.Our.Yesterdays.mp3" },
    { side: "SIDE A", track: "13", title: "Still Beating", file: "13.-.Still.Beating.mp3" },
    { side: "SIDE A", track: "14", title: "Passing Out Pieces", file: "14.-.Passing.Out.Pieces.mp3" },
    { side: "SIDE A", track: "15", title: "Home", file: "15.-.Home.mp3" },
    { side: "SIDE A", track: "16", title: "No Other Heart", file: "16.-.No.Other.Heart.mp3" },

    // SIDE B
    { side: "SIDE B", track: "17", title: "20210218 Round Here", file: "17.-.20210218.Round.Here.mp3" },
    { side: "SIDE B", track: "18", title: "Rock And Roll Night Club", file: "18.-.Rock.And.Roll.Night.Club.mp3" },
    { side: "SIDE B", track: "19", title: "Heart To Heart", file: "19.-.Heart.To.Heart.mp3" },
    { side: "SIDE B", track: "20", title: "This Old Dog", file: "20.-.This.Old.Dog.mp3" },
    { side: "SIDE B", track: "21", title: "Ode to Viceroy", file: "21.-.Ode.to.Viceroy.mp3" },
    { side: "SIDE B", track: "22", title: "20200820 Turn My TV On", file: "22.-.20200820.Turn.My.TV.On.mp3" },
    { side: "SIDE B", track: "23", title: "One More Love Song", file: "23.-.One.More.Love.Song.mp3" },
    { side: "SIDE B", track: "24", title: "Another One", file: "24.-.Another.One.mp3" },
    { side: "SIDE B", track: "25", title: "Rooster", file: "25.-.Rooster.mp3" },
    { side: "SIDE B", track: "26", title: "Freaking Out The Neighborhood", file: "26.-.Freaking.Out.The.Neighborhood.mp3" },
    { side: "SIDE B", track: "27", title: "Holy", file: "27.-.Holy.mp3" },
    { side: "SIDE B", track: "28", title: "Moonlight on the River", file: "28.-.Moonlight.on.the.River.mp3" },
    { side: "SIDE B", track: "29", title: "Chamber of Reflection", file: "29.-.Chamber.of.Reflection.mp3" },
    { side: "SIDE B", track: "30", title: "My Kind Of Woman", file: "30.-.My.Kind.Of.Woman.mp3" },
    { side: "SIDE B", track: "31", title: "Bonus Track - No Other Heart", file: "31.-.Bonus.Track.-.No.Other.Heart.mp3" },
    { side: "SIDE B", track: "32", title: "Bonus Track - For the First Time", file: "32.-.Bonus.Track.-.For.the.First.Time.mp3" }
  ];

  playlist.forEach(item => {
    item.url = baseUrl + item.file;
  });

  let currentIndex = 0;
  const audio = document.getElementById("audio");
  const vinyl = document.getElementById("vinyl");
  const playBtn = document.getElementById("play-btn");
  const progress = document.getElementById("progress");

  function renderTracklist() {
    const sideA = document.getElementById("side-a-tracks");
    const sideB = document.getElementById("side-b-tracks");
    sideA.innerHTML = ""; sideB.innerHTML = "";

    playlist.forEach((item, index) => {
      const html = `
        <div class="track-item ${index === currentIndex ? 'active' : ''}" onclick="loadTrack(${index}, true)">
          <span class="t-name">${item.track}. ${item.title}</span>
          <a href="${item.url}" class="download-btn" target="_blank" onclick="event.stopPropagation()">⬇ MP3</a>
        </div>
      `;
      if (item.side === "SIDE A") sideA.innerHTML += html;
      else sideB.innerHTML += html;
    });
  }

  function loadTrack(index, autoPlay = false) {
    currentIndex = index;
    const track = playlist[index];
    audio.src = track.url;
    document.getElementById("display-title").innerText = `${track.track}. ${track.title}`;
    document.getElementById("display-side").innerText = track.side;
    renderTracklist();
    
    if (autoPlay) playAudio();
  }

  function playAudio() {
    audio.play().then(() => {
      playBtn.innerText = "⏸";
      vinyl.classList.add("playing");
    }).catch(err => console.log("Errore riproduzione:", err));
  }

  function pauseAudio() {
    audio.pause();
    playBtn.innerText = "▶";
    vinyl.classList.remove("playing");
  }

  function togglePlay() {
    if (audio.paused) playAudio();
    else pauseAudio();
  }

  function stopTrack() {
    pauseAudio();
    audio.currentTime = 0;
  }

  function prevTrack() {
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(currentIndex, true);
  }

  function nextTrack() {
    currentIndex = (currentIndex + 1) % playlist.length;
    loadTrack(currentIndex, true);
  }

  audio.addEventListener("timeupdate", () => {
    if (audio.duration && !isNaN(audio.duration)) {
      progress.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById("current-time").innerText = formatTime(audio.currentTime);
      document.getElementById("total-time").innerText = formatTime(audio.duration);
    }
  });

  progress.addEventListener("input", () => {
    if (audio.duration && !isNaN(audio.duration)) {
      audio.currentTime = (progress.value / 100) * audio.duration;
    }
  });

  document.getElementById("volume").addEventListener("input", (e) => {
    audio.volume = e.target.value;
  });

  function toggleMute() {
    audio.muted = !audio.muted;
    document.getElementById("mute-btn").innerText = audio.muted ? "🔇" : "🔊";
  }

  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  audio.addEventListener("ended", nextTrack);

  loadTrack(0, false);
</script>
</body>
</html>
